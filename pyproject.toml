[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrag-research"
version = "0.1.0"
description = "Reproducible context-selection experiments for quantum RAG research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
models = ["torch", "transformers", "sentence-transformers", "huggingface-hub"]
research = ["faiss-cpu", "rank-bm25", "networkx", "qiskit", "qiskit-aer", "matplotlib", "datasets", "gdown", "httpx"]
service = ["fastapi", "uvicorn", "opentelemetry-sdk"]
dev = ["pytest", "ruff", "httpx", "build", "mypy"]
publishing = ["reportlab", "pdfplumber", "pypdf"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrag*"]

[tool.setuptools.package-data]
qrag_service = ["static/*.html"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
