[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrag-research"
version = "0.1.0"
description = "Reproducible context-selection experiments for quantum RAG research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
models = ["torch", "transformers", "sentence-transformers", "huggingface-hub"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrag*"]
