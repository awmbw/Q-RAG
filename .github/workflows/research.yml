name: Research software checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps .
      - run: python -m ruff check src/qrag src/qrag_service scripts tests
      - run: python -m ruff format --check src/qrag src/qrag_service scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build --wheel
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build --build-arg WITH_MODELS=0 -t qrag-service-ci .
      - run: docker run --rm qrag-service-ci python -c "from qrag_service.app import app; assert app.title"
